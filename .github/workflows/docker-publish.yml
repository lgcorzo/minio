name: Build & Publish MinIO Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
      - "RELEASE.*"
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Optional custom image tag (e.g. microk8s-v1)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: minio

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKER_HUB_USERNAME != ''
        uses: docker/login-action@v3
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Determine Image Tags
        id: meta
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_BASE="ghcr.io/${REPO_OWNER}/${IMAGE_NAME}"
          TAGS="${GHCR_BASE}:latest,${GHCR_BASE}:${{ github.sha }},${GHCR_BASE}:microk8s-latest"

          # Add branch or tag reference
          REF_CLEAN=$(echo "${{ github.ref_name }}" | tr '/' '-')
          TAGS="${TAGS},${GHCR_BASE}:${REF_CLEAN}"

          # Also publish under mc repository for tools expecting separate minio/mc image

          # Add custom tag if triggered via workflow_dispatch
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAGS="${TAGS},${GHCR_BASE}:${{ github.event.inputs.custom_tag }}"
          fi

          # If Docker Hub username secret is configured, append docker.io tags
          if [ -n "${DOCKER_HUB_USERNAME}" ]; then
            DOCKER_BASE="docker.io/${DOCKER_HUB_USERNAME}/${IMAGE_NAME}"
            TAGS="${TAGS},${DOCKER_BASE}:latest,${DOCKER_BASE}:${{ github.sha }},${DOCKER_BASE}:microk8s-latest,${DOCKER_BASE}:${REF_CLEAN}"
            if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
              TAGS="${TAGS},${DOCKER_BASE}:${{ github.event.inputs.custom_tag }}"
            fi
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Built tags: ${TAGS}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_ID=${{ github.sha }}
            RELEASE=${{ github.ref_name }}
            TARGETARCH=amd64
