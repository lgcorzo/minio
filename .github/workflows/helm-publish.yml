name: Package & Publish Helm Chart to GHCR

on:
  push:
    branches:
      - master
    paths:
      - "helm/**"
      - ".github/workflows/helm-publish.yml"
    tags:
      - "v*"
      - "RELEASE.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-chart:
    name: Package and Push OCI Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package Helm Chart
        run: |
          mkdir -p /tmp/charts
          helm package helm/minio -d /tmp/charts

      - name: Push Helm Chart to GHCR
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for chart in /tmp/charts/*.tgz; do
            echo "Pushing ${chart} to oci://ghcr.io/${REPO_OWNER}/charts..."
            helm push "${chart}" "oci://ghcr.io/${REPO_OWNER}/charts"
          done
