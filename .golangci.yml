linters-settings:
  misspell:
    locale: US
  staticcheck:
    checks:
      - all
      - -SA1008
      - -SA1019
      - -SA4000
      - -SA9004
      - -ST1000
      - -ST1005
      - -ST1016
      - -U1000

linters:
  disable-all: true
  enable:
    - durationcheck
    - forcetypeassert
    - gocritic
    - gomodguard
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace

issues:
  max-issues-per-linter: 100
  max-same-issues: 100
  exclude-use-default: false
  exclude:
    - "empty-block:"
    - "unused-parameter:"
    - "dot-imports:"
    - should have a package comment
    - error strings should not be capitalized or end with punctuation or a newline
  exclude-rules:
    - path: _test\.go
      linters:
        - forcetypeassert
    - path: (third_party|builtin|examples)
      linters:
        - gocritic
        - revive

